name: iOS Build (unsigned)

# Builds an unsigned iOS .app on a macOS runner so it can be sideloaded
# with Sideloadly from a Linux machine (no Apple Developer Account needed).

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push on the same branch cancels the previous build.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.6' # pin for reproducible builds; delete to track latest stable

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        # The Flutter project lives in frontend/, not at the repo root.
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned archive
        # --no-codesign skips signing/export, so no Apple account is required.
        # This produces build/ios/archive/Runner.xcarchive (not an .ipa).
        run: flutter build ipa --release --no-codesign

      - name: Locate Runner.app
        id: locate
        run: |
          set -euo pipefail
          ARCHIVE_APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          DEVICE_APP="build/ios/iphoneos/Runner.app"
          APP_PATH=""
          if [ -d "$ARCHIVE_APP" ]; then
            APP_PATH="$ARCHIVE_APP"
          elif [ -d "$DEVICE_APP" ]; then
            APP_PATH="$DEVICE_APP"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found. Contents of build/ios:"
            ls -R build/ios || true
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify device build
        # Guards against shipping a simulator binary: Sideloadly needs an arm64
        # build whose platform is iphoneos, not iphonesimulator.
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"

          echo "== Binary architecture =="
          lipo -info "$APP_PATH/Runner"

          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$APP_PATH/Info.plist")
          echo "DTPlatformName = $PLATFORM"
          if [ "$PLATFORM" != "iphoneos" ]; then
            echo "::error::Built for '$PLATFORM', not 'iphoneos'. Sideloadly needs a device build."
            exit 1
          fi

          ARCH=$(lipo -info "$APP_PATH/Runner")
          case "$ARCH" in
            *arm64*) ;;
            *)
              echo "::error::Runner is not arm64 - this is not a real-device build."
              exit 1
              ;;
          esac

      - name: Package as unsigned .ipa
        # An .ipa is just a zip with Payload/Runner.app at its root. Sideloadly
        # requires the .ipa extension (it rejects a .zip or a bare .app folder)
        # and re-signs it with your Apple ID, so no signing happens here.
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"

          rm -rf build/unsigned
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/Runner.app

          cd build/unsigned
          # -y keeps the symlinks inside Frameworks/ intact.
          zip -r -y -q DevLex-unsigned.ipa Payload

          echo "IPA size: $(du -h DevLex-unsigned.ipa | cut -f1)"

          # Capture the listing once: piping into head/grep under pipefail can
          # abort with SIGPIPE and fail the step for no real reason.
          LISTING=$(unzip -l DevLex-unsigned.ipa)
          printf '%s\n' "$LISTING" | sed -n '1,6p'
          case "$LISTING" in
            *"Payload/Runner.app/Runner"*) ;;
            *)
              echo "::error::Payload/Runner.app/Runner missing from the ipa."
              exit 1
              ;;
          esac


      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-app
          path: frontend/build/unsigned/DevLex-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
